{% extends "base.html" %}
{% load i18n %}

{% block content %}
  {% include "components/explainer-card.html" with type="info" p1=editor_help %}
  <form method="post" id="question-editor">
    {% csrf_token %}
    <div id="vueMount">
      <question-editor-container :initial-data="questionEditorData"></question-editor-container>
    </div>
    <noscript><p class="alert alert-warning">{% trans "Enable JavaScript to edit questions." %}</p></noscript>
  </form>
{% endblock %}

{% block js %}
  {{ question_editor_data|json_script:"question-editor-data" }}
  <script>
    window.vueData = {
      questionEditorData: JSON.parse(document.getElementById('question-editor-data').textContent),
    }
  </script>
  {{ block.super }}
{% endblock %}
