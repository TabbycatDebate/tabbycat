{% extends "base.html" %}
{% load i18n static %}
{% block extra-css %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'importer/csv-importer.css' %}">
{% endblock %}
{% block content %}
<div id="vueMount" class="csv-importer">
  <wizard-steps :steps="csvImportData.steps" form-id="csv-wizard"></wizard-steps>
  {% block csv_content %}{% endblock %}
</div>
{% endblock %}
{% block js %}
  {{ csv_vue_data|json_script:"csv-import-data" }}
  <script>
    window.vueData = {
      csvImportData: JSON.parse(document.getElementById('csv-import-data').textContent),
    }
  </script>
  {{ block.super }}
{% endblock %}
