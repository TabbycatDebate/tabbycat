{% load i18n %}
<nav class="csv-file-list card mb-3" aria-label="{% trans 'Uploaded CSV files' %}">
  <div class="card-header"><h2 class="h6 mb-1">{% trans "Files to import" %}</h2><small class="text-muted">{% blocktrans count count=file_groups|length %}{{ count }} file{% plural %}{{ count }} files{% endblocktrans %} · {{ row_count }} {% trans "rows" %}</small></div>
  <div class="list-group list-group-flush">
    {% for file in file_groups %}
      <button type="button" class="list-group-item list-group-item-action csv-file-button" data-csv-file="{{ file.index }}" aria-controls="csv-file-{{ file.index }}" aria-pressed="false">
        <span class="d-flex align-items-start"><i data-feather="file-text" class="mr-2 flex-shrink-0"></i><span class="csv-file-label"><strong class="d-block">{{ file.name }}</strong><small class="text-muted">{{ file.type_label }} · {% blocktrans count count=file.row_count %}{{ count }} row{% plural %}{{ count }} rows{% endblocktrans %}</small></span></span>
        <span class="d-block mt-2" data-file-status>{% if file.attention_count %}<span class="badge badge-warning">{{ file.attention_count }} {% trans "need attention" %}</span>{% elif wizard.steps.current == 'preview' %}<span class="badge badge-success">{% trans "Ready" %}</span>{% else %}<span class="badge badge-light">{{ file.mapped_count }} {% trans "columns mapped" %}</span>{% endif %}{% if file.skip_count %} <span class="badge badge-secondary">{{ file.skip_count }} {% trans "skipped" %}</span>{% endif %}</span>
      </button>
    {% endfor %}
  </div>
</nav>
