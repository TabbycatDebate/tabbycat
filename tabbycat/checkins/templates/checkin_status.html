{% extends "base.html" %}
{% load debate_tags %}

{% block content %}

  <div id="vueMount">
    <check-in-status-container :initial-events="events"
                               :tournament-slug="tournamentSlug"
                               :adjudicators="adjudicators"
                               :speakers="speakers"
                               :venues="venues"
                               :team-codes="teamCodes"
                               :show-adjudicator-institutions="showAdjudicatorInstitutions"
                               :for-admin="forAdmin"
                               :team-size="teamSize"
                               :prelims-completed="prelimsCompleted">
    </check-in-status-container>
  </div>

{% endblock content %}

{% block js %}
  <script>
    window.vueData = {
      'events': {{ events|safe }},
      'tournamentSlug': '{{ tournament_slug }}',
      'adjudicators': {% if adjudicators %}{{ adjudicators|safe }}{% else %}null{% endif %},
      'speakers': {% if speakers %}{{ speakers|safe }}{% else %}null{% endif %},
      'venues': {% if venues %}{{ venues|safe }}{% else %}null{% endif %},
      'teamCodes': {{ team_codes }},
      'showAdjudicatorInstitutions': {{ pref.show_adjudicator_institutions|yesno:"true,false" }},
      'forAdmin': {% if for_admin %}true{% else %}false{% endif %},
      'teamSize': {{ team_size }},
      'prelimsCompleted': {% if prelims_completed %}true{% else %}false{% endif %},
    }
  </script>
  {{ block.super }}
{% endblock js %}
