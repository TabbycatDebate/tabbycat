import os

# Digital Ocean Gunicorn Configuration
# Optimized for $5 droplet (1GB RAM, 1 vCPU)

def when_ready(server):
    print('Tabbycat WSGI server ready with', workers, 'workers')

# Worker configuration for 1GB RAM droplet
# Rule of thumb: (2 x CPU cores) + 1, but limited by RAM
workers = 2  # Conservative for 1GB RAM

# Bind configuration
bind = '127.0.0.1:8000'
backlog = 2048

# Worker class
worker_class = 'sync'

# Worker process settings
worker_connections = 1000
max_requests = 200  # Restart workers after 200 requests to prevent memory leaks
max_requests_jitter = 50  # Add randomness to prevent all workers restarting at once

# Timeout settings
timeout = 30
keepalive = 2

# Memory and resource limits
preload_app = True  # Load app before forking workers (saves memory)
lazy_apps = False

# Process naming
proc_name = 'tabbycat-wsgi'

# Logging
accesslog = '/var/log/tabbycat/gunicorn_access.log'
errorlog = '/var/log/tabbycat/gunicorn_error.log'
loglevel = 'info'
access_log_format = '%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" %(D)s'

# Security
limit_request_line = 4094
limit_request_fields = 100
limit_request_field_size = 8190

# Directory
chdir = '/opt/tabbycat/tabbycat/'

# Environment
raw_env = [
    'ON_DIGITALOCEAN=1',
]
